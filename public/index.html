<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      `viewport-fit=cover` faz o layout ocupar a janela inteira do aparelho e,
      em troca, habilita o `env(safe-area-inset-*)`: e dai que a moldura da
      aplicacao le, no web, as faixas do relogio e do indicador de gestos. Sem
      este token as medidas chegariam zeradas e o conteudo ficaria por baixo.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- PWA_HEAD_START -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Core" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <style id="pwa-safe-area">
      html,
      body {
        background-color: #F3F4F6;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').catch(function () {});
        });
      }
    </script>
    <script src="/runtime-config.js"></script>
    <!-- PWA_HEAD_END -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* Impede o iOS de inflar o texto ao girar o aparelho para landscape */
      html {
        -webkit-text-size-adjust: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Remove o rubber-band / pull-to-refresh do PWA em modo standalone */
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
