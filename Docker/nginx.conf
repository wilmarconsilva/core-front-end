# Serve o build estático do Expo Web como SPA/PWA.
# Roda atrás do proxy reverso (TLS e compressão são resolvidos lá).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---- Shell da aplicação e artefatos de PWA: sempre revalidar ----
    # Sem isso o navegador/SW pode ficar preso numa versão antiga após o deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Bundles e assets versionados por hash: cache longo ----
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- Fallback de SPA: qualquer rota desconhecida devolve o shell ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
